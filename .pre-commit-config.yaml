exclude: third_party/

repos:
  - repo: local
    hooks:
      - id: check-repo-size
        name: Check staged files are at most 5 MiB
        entry: python3 scripts/check_repo_size.py --staged
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.5.14
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.8.6
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      - id: ruff-format
